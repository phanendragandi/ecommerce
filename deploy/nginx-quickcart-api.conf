# deploy/nginx-quickcart-api.conf
#
# Reverse proxy for the QuickCart Express API (PM2, bound to 127.0.0.1:4000
# — never expose Node directly to the internet). Install with:
#
#   sudo cp deploy/nginx-quickcart-api.conf /etc/nginx/sites-available/quickcart-api
#   sudo ln -sf /etc/nginx/sites-available/quickcart-api /etc/nginx/sites-enabled/quickcart-api
#   sudo nginx -t && sudo systemctl reload nginx
#
# This file ships in HTTP-only form (listen 80) on purpose. Get it live and
# passing `nginx -t` FIRST, then run certbot (see deploy/RUNBOOK.md) — it
# will rewrite this file in place to add the `listen 443 ssl` block, the
# certificate paths, and an HTTP->HTTPS redirect. Do not hand-add a 443
# block before that; certbot's own edit is what keeps renewal wiring intact.
#
# Replace <API_DOMAIN> below (e.g. api.example.com) before use.
#
# Real client IP restoration — required so express-rate-limit (trust proxy=1
# in server/src/app.ts) and any access logging see the actual visitor IP
# instead of 127.0.0.1. Nginx already knows the peer IP; the X-Real-IP /
# X-Forwarded-For / X-Forwarded-Proto headers below pass it through to Node.
# (nginx does not usefully inherit proxy_set_header from server{} into every
# location{} once a location sets its own, so each location block repeats
# the full set explicitly rather than relying on inheritance.)

server {
    listen 80;
    listen [::]:80;
    server_name <API_DOMAIN>;

    # Uploads: seller product images are capped at 4 files x 5MB in the
    # multer config — 25m gives headroom for multipart overhead without
    # opening the door to arbitrarily large bodies. helmet + the app's own
    # express.json({ limit: '1mb' }) still apply to non-multipart routes.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        text/plain
        text/css;
    # Do NOT gzip the webhook route response body — it's tiny JSON either
    # way, but more importantly: gzip only touches the *response*, never the
    # request body, so it has no effect on webhook signature verification.
    # Left enabled globally for that reason; see the webhook location block
    # below for the setting that actually matters (proxy_request_buffering).

    # ------------------------------------------------------------------
    # Razorpay webhook — MUST reach Express with the raw, untouched body.
    # The handler (server/src/routes/payments.ts) computes an HMAC over the
    # exact bytes Razorpay sent; any proxy-side buffering/transformation
    # that alters chunking or re-encodes the body would break signature
    # verification. This block disables request buffering so Nginx streams
    # the body straight through instead of reading it fully into memory
    # first, and explicitly does not run it through any body-rewriting
    # module. No special content-type handling is needed on the Nginx side
    # — Express itself mounts this route with express.raw() ahead of
    # express.json(), so as long as Nginx forwards bytes unmodified (which
    # proxy_pass does by default for the body), signature verification
    # works.
    # ------------------------------------------------------------------
    location = /api/payments/webhook {
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Note on security headers: helmet() in server/src/app.ts already sets
    # X-Content-Type-Options, X-Frame-Options, HSTS (once on HTTPS), etc. on
    # every response. Nothing duplicated here — avoid two layers disagreeing
    # on the same header.
}

# ----------------------------------------------------------------------
# After certbot runs (see deploy/RUNBOOK.md), this file will additionally
# contain something like the block below (certbot writes it automatically
# via `certbot --nginx`; shown here only for reference — do not hand-copy
# it in before running certbot, or the ACME http-01 challenge on port 80
# above may not match what certbot expects to find/modify):
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     server_name <API_DOMAIN>;
#     ssl_certificate     /etc/letsencrypt/live/<API_DOMAIN>/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/<API_DOMAIN>/privkey.pem;
#     include /etc/letsencrypt/options-ssl-nginx.conf;
#     ssl_dhparam /etc/letsencrypt/ssl-dhparam.pem;
#     ... (same location blocks as above) ...
# }
#
# server {
#     if ($host = <API_DOMAIN>) {
#         return 301 https://$host$request_uri;
#     }
#     listen 80;
#     listen [::]:80;
#     server_name <API_DOMAIN>;
#     return 404;
# }
# ----------------------------------------------------------------------
